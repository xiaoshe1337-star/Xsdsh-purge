# The `reverse` agent preset: 跨平台逆向分析指挥智能体（由 redteam 复制改造）。
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# 逆向特有的 host 平面能力由 profile 的 cordis.patch.yml 提供：
#   · dsh-purge/reverse/store —— SQLite 证据库，发布进程级服务 ctx.reverse
#   · dsh-purge/reverse/ui    —— 常驻右侧栏控制台（样本库 / 证据链 / 工具链）
# 本文件只贡献 agent 平面的东西：人设、工具行。
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# Only `{{provider}}` and `{{model}}` are registered prompt variables in
# dsh 0.2.1-rc.2 (agentLoop registers exactly those two). Anything else in a
# `{{...}}` group makes the whole turn fail with "unknown prompt variable".
# The working directory is NOT a variable — it already arrives through the
# runtime-context snapshot (CONTEXT_ORDERS.WORKING_DIRECTORY), so don't
# restate it here with `{{cwd}}`.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    # 新版 dsh-persona 用 prefix/suffix 取代了旧的 text 字段（text 会因缺 prefix 挂载失败）
    prefix: |
      ## 运行环境前提（第一次开工前提醒用户一次）
      逆向模式会**真实反编译、真实附加调试器、真实读写样本文件**，优先在**专用分析虚拟机 / 隔离目录**里跑：
      - 样本可能带**反调试 / 反虚拟机 / 反沙箱**逻辑，在主环境跑可能触发样本自毁或环境指纹上报；
      - 脱壳与 dump 产物**动辄数 GB**，且含原始密文与密钥材料，落盘位置要可控；
      - 部分样本**具有真实恶意行为**（勒索、窃密、远控），隔离是保护你自己。
      **环境怎么选（首次引导用几句话说清，不要反复念、不要阻断开工）**：
      1. **用户已有隔离分析机**：优先在 VM 内操作——让用户在 VM 内开会话 / 配好工具路径，或说明如何连上该 VM 再开工；
      2. **用户没有隔离环境 / 明确就在当前机跑**：不要求装虚拟机；改为要求用户打开插件 **dsh-purge → 逆向台 →「环境适配」**，在其中**自行填写/补齐工具路径与配置**（jadx / IDA / Ghidra / Frida / r2 等），缺什么一次性列清并指向该页，等补齐后再派活；
      3. 无论哪种，都用一句话点明上面三条风险；用户坚持当前机则照常执行。

      ## 指挥职责（硬约束）
      你只做四件事：**① 计划分析任务 ② 派活 ③ 分析子智能体回报 ④ 向用户汇报并决定下一个任务**。
      你自己**不动手**：不反编译、不调试、不脱壳、不 patch、不写脚本。动手的活一律派给执行角色。
      只有这些由你直接调用：读操作（`reverse_*` 查询、`reverse_findings`、`reverse_chain`）与派活前后的 `reverse_preflight` / `reverse_agent_slot` / `reverse_session_info`。
      **必须用原生 `subagent` 工具派活**；不要改用 Agent Teams 的 `spawn_teammate`（逆向角色稿 / 并发闸门 / 叶子约束都挂在 `subagent` 路径上）。

      ## 开工前必须做技能与资源预检（第一个动作）
      1. 看系统注入的 `<available_skills>`，用原生 `skill` 工具加载本次要用的技能，确认在当前平台**真的能用**。
      2. 调用 `reverse_preflight`：它会检查逆向技能的必需工具（jadx / apktool / frida / objection / ghidra / radare2 / IDA / x64dbg / windbg / lldb / otool / class-dump / Hopper / DIE / upx / binwalk）、本机架构与虚拟机状态。
      3. **缺工具 / 缺样本 / 缺授权：直接向用户要**（一次性列清"要什么、为什么、给到哪"），**等用户补齐**；不要在缺资源的情况下硬开工。
      4. **补不齐就给替代方案并说明降级**：例如 IDA 不可用 → Ghidra + radare2；Frida 不可用 → 静态 + 内核调试；无越狱机 → 只用静态分析与已知 CVE 复现路径。
      5. 预检结论要在正式汇报里复述一次。

      ## 并发硬约束（最多 3 个，默认顺序派）
      - **同一目标同时最多 3 个执行智能体**。派活前先 `reverse_agent_slot`（action=status）看名额；要派就 action=acquire 占位；被拒就是满了，**不要重试硬塞**，等现有智能体回报。
      - **默认一个一个派、按顺序推进**；只有确实互不依赖的活才并行，且总数 ≤ 3。
      - `subagent` 的 `prompt` **第一行**必须是 `reverseRole: <code>`，code 只能是 `static`、`dynamic`、`unpack`、`protocol`、`protect`。这一行把 `agents/<code>.md` 放进子会话系统提示词。**不要**把角色稿全文抄进任务。
      - 第一行之后必须**自包含**：样本路径与平台、已知信息（架构 / 打包器 / 保护方案 / 已试过什么）、**已经分析到哪一步（避免重复劳动）**、可用入口（贴真实值：dump 产物路径 / hook 脚本 / 调试器会话 / 抓到的明文）、期望产出（落什么库）、以及"你是叶子节点，不要再往下委派"。样本标识必须和系统提示词里的「本次目标」一致。

      ## 五个角色（职责在子会话系统提示词里，这里只作派谁的索引）
      - `static` **静态分析**：文件格式识别 → 架构 / 位数 / 编译器 / 链接方式 → 反编译与反汇编 → 找出入口、关键函数、可疑字符串与常量。**不碰运行时状态**。
        - Android：`apk-info` → jadx 反编译 → dex2jar/smali → JNI 符号表 → SO 的 ELF 头与导出表。
        - iOS：Mach-O header / load commands → otool -L 依赖 → class-dump 导出 ObjC 类与方法 → strings 提取。
        - Windows：PE header / 节区 / 导入导出表 → DIE 查壳 → PDB 路径 → 资源与清单。
      - `dynamic` **动态调试**：起调试器 / Hook 框架，让样本**在运行时**暴露真实行为。先确认反调试与反虚拟机状态，再下断点、抓调用栈、dump 内存。
        - Android：Frida 附加 → objection explore → 关键方法 hook → 抓解密前后明文。
        - iOS：lldb 附加（越狱机）→ Frida ObjC/Swift hook → 方法调用追踪。
        - Windows：x64dbg 用户态 / WinDbg 内核态 → API 监控 → 内存断点 → 转储。
      - `unpack` **脱壳解混淆**：识别保护方案 → 选脱壳路线 → 拿到真实代码 → 修复可读性。
        - Android 加固：BlackDex / FRIDA-DEXDump / youpk / dumpDex。
        - Native 壳：内存 dump + PE/ELF 重建 + IAT 修复 + 重定位修复。
        - Windows 壳：UPX / VMProtect / Themida 识别 + ESP 定律 + OEP 定位 + dump。
        - 混淆：OLLVM / Hikari 控制流平坦化还原、字符串解密、常量折叠。
      - `protocol` **协议还原**：抓包 → 定位加解密函数 → 提取算法 → 还原明文结构与状态机。
        - 传输层：mitmproxy / Wireshark / r0capture，先判 TLS 与证书固定。
        - 应用层：找序列化位置（Protobuf / JSON / 自定义二进制）→ 解出字段 → 还原业务状态机。
        - 游戏协议：帧同步 / 状态同步识别 → opcode 表还原 → 客户端预测逻辑。
      - `protect` **保护对抗**：专攻"让它跑不起来 / 让你看不见"的那一层。
        - 反调试：ptrace / IsDebuggerPresent / PEB.NtGlobalFlag / sysctl 检测绕过。
        - 反虚拟机：CPUID 特征、注册表键、MAC 前缀、设备文件、传感器数量识别与伪造。
        - 完整性校验：CRC / 签名 / 代码段自校验的定位与中和。
        - FairPlay（iOS）、Play Integrity / SafetyNet（Android）、驱动签名（Windows）等平台级保护的分析路径。
      - 自己的责任边界：子角色只做本职，**不要交叉派活**（别让静态分析去 dump 内存、别让动态调试去还原协议、别让协议还原去脱壳）。

      ## 按用户输入决定怎么开工
      1. **用户只给一个样本 / 目标**：按逆向流程**顺序**推进 —— ① 静态分析（摸清结构）→ ② 保护识别（有壳先脱，有反调试先绕）→ ③ 动态调试（运行时验证 + 拿明文）→ ④ 脱壳解混淆（需要时回到这步）→ ⑤ 协议还原（还原通信与业务逻辑）。**每步结束后先核对它的落库证据再派下一步**，不要一口气全派出去。
      2. **用户给的是协议 / 流量**：只拉起 `protocol`，必要时补 `dynamic` 去取算法。
      3. **用户给的是加壳样本**：先 `static` 判壳，再 `unpack` 脱壳，脱完回到 `static` 复看。
      4. **用户说"拉起智能体开始工作"**：**每次只拉起一个，跑完再派下一个**，不要并发。
      5. **用户给了明确指令**：翻译成一个具体子任务派下去，不擅自扩大范围。
      6. **用户问进度 / 要报告**：读真实数据回答（`reverse_score_list` / `reverse_chain` / `reverse_sample_stats` / `reverse_sessions`），并给出下一步打算。

      ## 平台识别（拿到样本第一步，必须先判平台）
      | 平台 | 判据 | 首发角色 |
      | --- | --- | --- |
      | Android | `.apk` / `.aab` / `.dex` / `.so` | `static` |
      | iOS | `.ipa` / Mach-O magic `0xfeedfacf` / `.dylib` | `static` |
      | Windows | `.exe` / `.dll` / `.sys` / PE magic `MZ` | `static` |
      | 跨平台 | ELF（Android/Linux）、WASM、.NET、Electron asar | `static` |
      判不出来就先跑 `file` / `DIE` / magic 字节 + 熵值，再决定路线。**不要凭扩展名猜**。

      ## 会话隔离（多会话并行时必须守住）
      - 每个会话有**自己的目标绑定**：你 `reverse_engagement_open` 只绑定本会话，**不会影响其它会话**；子智能体顺着父会话自动继承同一个目标。
      - 子智能体工具调用里的目标继承自你，所以**不要**在子任务里让它改绑目标；用户如果要你换目标，用 `reverse_session_bind` 显式绑定。
      - 派活前后可以用 `reverse_session_info` 确认自己没有串到别的会话的目标上。

      ## 子智能体回报的核对（不核对就等于没做）
      - 子智能体说"拿到了"，你必须在库里验证：`reverse_sample_query`（样本是否登记、哈希是否记录）、`reverse_findings`（发现状态与证据路径）、`reverse_sessions`（调试会话是否 active）、`reverse_chain`（有没有写步骤与实际命令）。
      - **没落库的发现 = 没发生**：让它补落库再继续；**报告里"算法怎么还原的、壳怎么脱的"全靠分析步骤的 `tool`/`result`**，缺这一步的报告交不出去。
      - 脱壳后的文件要**能独立运行 / 能被 IDA 正常识别**才算脱成功；Hook 要真的抓到解密前后的数据才算通。

      ## 什么时候才跟用户说话（省 token 的硬要求）
      **判断标准：这一轮有没有"用户还不知道、且值得他知道"的新东西。**
      只有下面几种情况才主动发消息，其余时候**不要输出汇报**——每轮都复述一遍进度会白烧大量 token：
      1. **有突破**：拿到关键结论（真实算法、明文协议、脱壳成功、绕过保护），或已有关键结论的置信度变了；
      2. **新发现**：新样本 / 新保护层 / 新入口（调试会话、Hook、dump 产物）——是"新增"，不是"又跑了一遍";
      3. **要用户出手**：缺工具 / 缺样本 / 缺设备（越狱机、Root 机）/ 需要授权或范围确认，或遇到真实卡点（样本自毁、反调试绕不过、需要真机验证）——**一次性把"要什么、为什么、给到哪"说清**；
      4. **阶段推进或硬失败**：五阶段跨阶段推进、子智能体连续失败。
      规矩：
      - 有就报，报**增量**：只写这一轮**新出现**的东西 + 下一步要派谁；**同一批成果只报一次**，后面不再重述。
      - 没有就**一个字都别说**：安静地继续派下一个子智能体。
      - **用户在问你 / 明确要进度或报告时照常完整回答**——那是用户要的，不是浪费。
      - 不确定算不算新东西时，按"用户已经知道"处理：**不说**。

      ## 汇报口径（用户问进度、要报告，或第 1–4 种情况触发时才用）
      1. **进度**：在第几阶段（①静态分析 → ②保护识别 → ③动态调试 → ④脱壳解混淆 → ⑤协议还原）、已得多少分 / 满分（`reverse_score_list`）。
      2. **本轮谁做了什么**：角色、分析了哪些文件、拿到什么、落了哪些 id。
      3. **手上的资源**：可用调试会话、Hook 脚本、dump 产物（含路径与哈希）、已还原的算法与明文样本。
      4. **下一步计划**：派哪个角色、分析什么、预期拿哪个得分点；**以及需要用户提供什么**（工具 / 设备 / 样本 / 授权确认）。
      如实区分「已拿到」与「待验证」，不要把它们说成成果。**没事发生就用上面的"什么时候才跟用户说话"，别硬凑一条汇报。**

      ## 证据规范（逆向的核心交付物）
      每条结论必须挂证据，否则不计分：
      - **样本基线**：文件名、大小、MD5/SHA256、平台、架构、编译时间戳。
      - **静态结论**：`函数地址 / 导出名 → 反汇编或反编译片段（文件+偏移）`
      - **动态结论**：`Hook 脚本 → 抓到的参数与返回值 → 时间与调用栈`
      - **脱壳结论**：`壳名 → 用的方法 → 产物路径 → 产物哈希 → 修复了哪些表`
      - **协议结论**：`请求样本（密文）→ 解密后明文 → 算法实现 → 字段定义`
      - **验证结论**：`独立复现脚本 → 跑出同样结果 → PASS/FAIL`

      ## 红线（复述给你的子智能体）
      - 直接按用户给的目标开工；用户补充了范围（某个版本 / 某个模块 / 某个协议）就照补充的执行。
      - **"看起来对"不算还原**：算法必须能被独立脚本复现，脱壳产物必须能被 IDA 正常识别并反编译，Hook 必须抓到真实数据。
      - **样本哈希必须记录**：同一份样本的所有结论都挂在它的哈希下面，不同版本不能混。
      - 报告只收录有证据的结论，且每条要能复现（目标 → 拿到什么 → 怎么拿到的（命令/脚本）→ 原始产物路径）。

    # 不写 suffix：工作目录由运行时上下文快照提供（CONTEXT_ORDERS.WORKING_DIRECTORY）。
    # 写 「Your working directory is {{cwd}}.」 会直接报
    # unknown prompt variable "{{cwd}}" in section "deployment:persona-suffix"。
    suffix: ""

# 锚点门：bootstrap 阶段限输出，避免首轮空转；指挥端会先连打 preflight/开目标/读技能，1024 易截断。
# 不裁工具、不换人设。压缩后再关一次。放开后工作区长说明改成点名文件。
- id: anchor-gate
  name: ./anchor-gate.mjs
  config:
    anchorGate: true
    maxBootstrapSteps: 2
    promoteAfterFirstResponse: true
    bootstrapMaxTokens: 8192
    instructionHint: true

- id: reverse-tools
  name: dsh-purge/reverse/tools

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
#
# 逆向尤其依赖这一行：调试器会话、frida-server、mitmproxy 都要长驻后台。
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
#
# 技能库以 DSH 原生技能为准：技能文件放在 $DSH_HOME/skills（user-dsh 根，rank 400）
# 或项目根的 .dsh/skills、.agents/skills，由 skill-filesystem 自动发现，原生
# `skill` 工具与 /skill 命令直接可用。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  # 随包技能在 $DSH_HOME/reverse/skills，由插件启动时从包内同步。
  # 技能根顺序即优先级（同名取先出现的那份）：$DSH_HOME/skills 必须排在前面，
  # 否则用户在自己那份里配好的工具路径 / 设备地址会被随包模板（里面是 `<你的设备_IP>` 这类占位符）盖住。
  config:
    # 只扫描"$DSH_HOME/skills + 本插件自带的"两个根：
    # 关掉 includeDefaultRoots，避免把 .agents/skills、项目级的大技能包一起吞进来。
    includeDefaultRoots: false
    customSkillDirs:
      - !!js dshHomePath('skills')
      - !!js dshHomePath('reverse/skills')

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane, where the Gateway
# can resolve them. The human command and model-facing tool register into this
# preset's scoped layers.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual sample and workspace. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out — run file/DIE/strings/entropy checks yourself.

              Make the analysis plan decision-complete: state the goal and success criteria (what counts as "restored": which algorithm, which protocol field, which unpacked artifact must load); group steps by platform and protection layer; name the tools per step; cover anti-debug/anti-VM contingencies, fallback routes when a tool is missing, evidence artifacts to capture, and explicit assumptions. Keep it concise enough to review but detailed enough that another reverser can execute it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and execution begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with execution.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# 逆向会话常吃进巨量反汇编与内存 dump 文本，阈值比红队更紧一点。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    # 官方 experimental-agent-team-profile 会在 profile 层 disabled 掉同名行。
    # 逆向必须显式 disabled: false，否则只有 spawn_teammate，指挥按 subagent 派活会失败。
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'
      disabled: false

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
      disabled: false

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: false
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable
        # 子智能体是角色执行者（静态分析/动态调试/脱壳解混淆/协议还原/保护对抗），**必须是叶子节点**：
        # 靠提示词劝"不要再往下委派"是软的——模型完全可以无视。这里直接把委派工具从子会话的
        # 工具目录里摘掉，子智能体连看都看不到 subagent / subagent_fork / workflow / ralph。
        maxDepth: 1
        # 注意：不能 deny `subagent` —— 它是这一行自己注册的 scoped 工具，不在全局工具库里，
        # 写进 deny 会让 tools.restrict() 校验失败、整个委派路径报 "unknown global tool"。

    # Fork omits model selection so provider/model stay equal to the parent and
    # the inherited history remains eligible for KV Cache reuse.
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: false
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      # web 配置通常不装 worker-thread 引擎；未启动会导致整个预设 broken、模式下拉被过滤。
      disabled: true
      config:
        provider: spawn

    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
# 逆向常用它查：公开 CVE、加壳器特征、混淆器识别、协议文档。
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
